{% extends "base.html" %}
{% block content %}
<table><tr><td>
<h2>Sign In</h2>
{% if reason == 'timeout' %}
  <div class="notice" id="ctl00_MainContent_pnlTimeout">
    Your session has expired. Please sign in again.
  </div>
{% endif %}
{% if error %}
  <div class="error" id="ctl00_MainContent_lblError">{{ error }}</div>
{% endif %}
<form method="post" action="/login">
  <table class="formgrid">
    <tr>
      <td><label for="ctl00_MainContent_txtUsername">Username</label></td>
      <td><input type="text" id="ctl00_MainContent_txtUsername"
                 name="ctl00_MainContent_txtUsername" /></td>
    </tr>
    <tr>
      <td><label for="ctl00_MainContent_txtPassword">Password</label></td>
      <td><input type="password" id="ctl00_MainContent_txtPassword"
                 name="ctl00_MainContent_txtPassword" /></td>
    </tr>
    <tr>
      <td></td>
      <td>
        <input type="submit" id="ctl00_MainContent_btnSignIn"
               name="ctl00_MainContent_btnSignIn" value="Sign In" />
      </td>
    </tr>
  </table>
</form>
<p style="font-size:10px;color:#666666">Demo credentials: demo / demo123</p>
</td></tr></table>
{% endblock %}
